[project]
name = "graph-city-pathfinding"
version = "1.0.0"
description = "Academic demonstration of search algorithms on a city road network graph. Compares A*, BFS, DFS, and Dijkstra for optimal pathfinding."
readme = "README.md"
license = "MIT"
authors = [
    { name = "ahincho", email = "ahincho@unsa.edu.pe" }
]
requires-python = ">=3.14"
keywords = ["pathfinding", "astar", "graph", "search", "algorithms", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "search-library>=1.0.0",
]

[project.scripts]
city-pathfinding = "graph_city_pathfinding.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graph_city_pathfinding"]

[tool.setuptools.package-dir]
graph_city_pathfinding = "src"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
